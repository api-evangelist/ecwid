- aid: ecwid:rest-api
  name: Ecwid REST API
  description: >-
    JSON REST API for managing Ecwid store data including products, categories, orders, customers, discount
    coupons, payment and shipping methods, application data, and storefront settings. Requests are made
    over HTTPS, authenticated via OAuth 2.0 access tokens (private for write access, public for read-only).
