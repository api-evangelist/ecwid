created: '2026-05-11'
modified: '2026-05-11'
specificationVersion: '0.19'
apis:
  - aid: ecwid:rest-api
    name: Ecwid REST API
    description: >-
      JSON REST API for managing Ecwid store data including products,
      categories, orders, customers, discount coupons, payment and shipping
      methods, application data, and storefront settings. Requests are made
      over HTTPS, authenticated via OAuth 2.0 access tokens (private for
      write access, public for read-only).
    humanURL: https://api-docs.ecwid.com/reference/overview
    baseURL: https://app.ecwid.com/api/v3
    tags:
      - E-Commerce
      - Online Store
      - Storefront
      - Products
      - Orders
