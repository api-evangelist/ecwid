aid: ecwid
name: Ecwid by Lightspeed
description: >-
  Ecwid by Lightspeed is a multi-channel e-commerce platform that lets
  merchants launch a storefront and sell across websites, social media
  (Instagram, TikTok, Facebook, Pinterest, Snapchat), online marketplaces,
  and in-person via point-of-sale. The platform handles centralized inventory
  and order management, automated marketing, payments, shipping, tax, and
  domain management. The Ecwid REST API exposes products, categories, orders,
  customers, payment and shipping methods, and storefront settings using
  OAuth 2.0 authentication with public (read-only) or private access tokens.
